name: Test and package Chrome Capture
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        default: v1.1.0
        required: true
      skip_validation:
        description: Package and publish without running validation
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser:
    if: ${{ !inputs.skip_validation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Browser verification
          path: artifacts/
          if-no-files-found: ignore
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare verified Windows AAC encoder
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl.zip'
          $release = Invoke-RestMethod 'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest'
          $asset = @($release.assets | Where-Object { $_.name -eq 'ffmpeg-master-latest-win64-lgpl.zip' })
          if ($asset.Count -ne 1 -or $asset[0].digest -notmatch '^sha256:[a-f0-9]{64}$') { throw 'Verified LGPL FFmpeg asset is missing' }
          $url = $asset[0].browser_download_url
          $expectedHash = $asset[0].digest.Substring(7)
          & curl.exe --fail --location --retry 3 --silent --show-error --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg download failed' }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expectedHash) { throw 'FFmpeg SHA-256 mismatch' }
          $extracted = Join-Path $env:RUNNER_TEMP 'ffmpeg-lgpl'
          Expand-Archive $archive $extracted -Force
          $binary = Get-ChildItem $extracted -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $probe = Get-ChildItem $extracted -Filter ffprobe.exe -Recurse | Select-Object -First 1
          $vendor = '.\native-host-windows\vendor'
          New-Item -ItemType Directory $vendor -Force | Out-Null
          Copy-Item $binary.FullName $vendor
          Get-ChildItem $binary.Directory.Parent.FullName -File | Copy-Item -Destination $vendor
          @('LGPL FFmpeg build: ' + $url, 'SHA256: ' + $expectedHash, 'Build scripts/source instructions: https://github.com/BtbN/FFmpeg-Builds', 'FFmpeg version and source revision:') | Set-Content (Join-Path $vendor 'SOURCE.txt')
          & $binary.FullName -version | Add-Content (Join-Path $vendor 'SOURCE.txt')
          "CHROME_CAPTURE_FFPROBE=$($probe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test Mac installer in a temporary directory
        if: runner.os == 'macOS' && !inputs.skip_validation
        shell: bash
        run: |
          set -euo pipefail
          export CVC_USER_LIBRARY_DIR="$RUNNER_TEMP/chrome-capture-library"
          bash native-host-mac/install-host.sh
          node tests/installer.mjs "$CVC_USER_LIBRARY_DIR/Application Support/Google/Chrome/NativeMessagingHosts/com.ssubong.chrome_capture.json"
          npm test
      - name: Compile Windows save helper
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ChromeCaptureLocal'
          & .\native-host-windows\install-host.ps1
      - name: Test Windows save helper
        if: runner.os == 'Windows' && !inputs.skip_validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'ChromeCaptureLocal'
          $manifest = Join-Path $env:LOCALAPPDATA 'ChromeCapture\native-host-windows\com.ssubong.chrome_capture.json'
          node tests/installer.mjs $manifest
          if ($LASTEXITCODE -ne 0) { throw 'Installer verification failed' }
          $env:CHROME_CAPTURE_TEST_HOST = (Get-Content $manifest -Raw | ConvertFrom-Json).path
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Windows behavior tests failed' }
      - name: Include Windows helper compiled on this runner
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Copy-Item (Join-Path $env:RUNNER_TEMP 'ChromeCaptureLocal\ChromeCapture\native-host-windows\VideoCaptureHost.exe') '.\native-host-windows\VideoCaptureHost.exe' -Force
      - name: Create platform ZIP
        run: node packaging/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }} package
          path: dist/*_Chrome_Capture.zip
          if-no-files-found: error
  publish:
    needs: [browser, packages]
    if: ${{ always() && needs.packages.result == 'success' && (needs.browser.result == 'success' || needs.browser.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '* package'
          path: dist
          merge-multiple: true
      - name: Publish release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/Mac_Chrome_Capture.zip dist/Win_Chrome_Capture.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/Mac_Chrome_Capture.zip dist/Win_Chrome_Capture.zip --target "$RELEASE_SHA" --title "Chrome Capture · $RELEASE_TAG" --notes 'MP4 tab video recording: 5, 8, 10, 12, 15, 20 seconds. Selectable M4A/MP3 audio and PNG capture, sharing one save folder. Windows helper compiled and tested on GitHub windows-latest; Mac package built on macos-latest.'
          fi
